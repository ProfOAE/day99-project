name: debug-oidc
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-oidc.yml']
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token and decode claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | python3 -c "import sys, base64, json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); print(json.dumps(json.loads(base64.b64decode(s)), indent=2))"
